# Fictional seed data for the "Acme Corp" example instance.
#
# Every repo, team, path, and description here is invented for this example.
# None of it is scanned from a real organisation. The technology names in
# `tech:` are real public products (LangGraph, FastAPI, Kubernetes, ...) —
# that part is deliberately realistic, since the whole point of the example
# is to demonstrate coverage/duplicates/gaps/experts/risk on a plausible
# stack. The internal systems (Atlas / Beacon / Forge) are fictional and
# defined in ../vocabulary/internal-system.yaml.
#
# Signals deliberately built into this data, so a fresh run of the pipeline
# reproduces something worth looking at in each of the five views:
#   - duplicates:   platform/agent-gateway and growth/model-router — two
#                   teams, same domain, near-identical stack, unrelated paths
#   - fork/copy:    growth/support-agent is a same-name copy of
#                   mobile/support-agent — the `duplicates` view should
#                   classify it as `same-name`, not `independent`
#   - bus factor=1: dbt, snowflake, okta-style oauth2 usage each belong to
#                   exactly one team
#   - internal lock-in: `atlas` is depended on by more than half the repos
#   - stale repo:   api-gateway/legacy-router has an old last_commit

repos:
  - path: platform/agent-gateway
    team: platform
    domain: "Platform / Gateway / Framework"
    name: "Agent Gateway"
    description: "Routes model calls through Portkey with per-team rate limits and request logging."
    value: "Central place every other team's agent traffic passes through before it reaches a model provider."
    last_commit: "2026-06-02"
    tech: [portkey, fastapi, langgraph, redis]
    internal_systems: [atlas]

  - path: growth/model-router
    team: growth
    domain: "Platform / Gateway / Framework"
    name: "Model Router"
    description: "Growth team's own request router in front of Portkey, built independently of the platform team's gateway."
    value: "Adds per-experiment routing rules on top of the shared model gateway."
    last_commit: "2026-05-20"
    tech: [portkey, fastapi, langgraph, redis, qdrant]
    internal_systems: [atlas]

