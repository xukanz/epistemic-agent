shard: agent-pattern
target_type: Pattern
label: Agent 架构模式
description: |
  这个分片接的不是 TechStack 而是 Pattern 节点。技术栈说明「用了什么」，
  模式说明「怎么用的」——后者才是管理层想知道的可复用做法。
  模式无法从依赖清单抽取，只能从 README / 项目描述里抽，
  因此这个分片主要服务 LLM 抽取路径（capmap ingest --llm）。

