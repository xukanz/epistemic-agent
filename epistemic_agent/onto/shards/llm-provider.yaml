  - id: llm:ollama
    label: Ollama
    aliases: [ollama]
  - id: llm:vllm
    label: vLLM
    aliases: [vllm]
  - id: llm:sglang
    label: SGLang
    aliases: [sglang]
  - id: llm:litellm
    label: LiteLLM
    aliases: [litellm]
  - id: llm:huggingface
    label: HuggingFace
    aliases: [huggingface, huggingface hub, huggingface 权重缓存, hf-hub, transformers,
              "transformers/peft", peft, sentence-transformers, fastembed, flashrank]
  - id: llm:torch
    label: PyTorch
    aliases: [torch, pytorch, "pytorch/flash-attention", flash-attention, "torch(cpu)"]
  - id: llm:portkey
    label: Portkey
    aliases: [portkey, portkey-ai, portkey 网关, "portkey/galileo", "portkey/azure-openai"]
  - id: llm:openrouter
    label: OpenRouter
    aliases: [openrouter]
