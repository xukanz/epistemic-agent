[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epistemic-agent"
version = "0.1.0"
description = "Enterprise technology capability map — agentic construction and maintenance of an org-wide capability knowledge graph"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "jsonlines>=4.0",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tui = ["textual>=0.80"]
llm = ["openai>=1.0", "anthropic>=0.25"]
# `capmap agent` has two backends, split into separate extras so installing
# one doesn't drag in a dependency the other doesn't use.
# anthropic: needs the Tool Runner beta (client.beta.messages.tool_runner,
#   anthropic.beta_tool), far newer than the plain chat/chat_json path `llm` needs.
# openai: for OpenAI itself, or any gateway that speaks the same
#   `/chat/completions` wire format (Portkey, LiteLLM, Azure OpenAI, a proxy
#   in front of Bedrock, ...). Uses the plain `openai` SDK; gateways that need
#   the key on a non-standard header set `OPENAI_EXTRA_HEADER` for it.
agent-anthropic = ["anthropic>=0.120.0"]
agent-openai = ["openai>=1.0"]
agent = ["epistemic-agent[agent-anthropic,agent-openai]"]
all = ["epistemic-agent[tui,llm,agent]"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
capmap = "epistemic_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["epistemic_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
