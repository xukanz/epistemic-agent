[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epistemic-agent"
version = "0.1.0"
description = "Enterprise technology capability map — agentic construction and maintenance of an org-wide capability knowledge graph"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "jsonlines>=4.0",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tui = ["textual>=0.80"]
llm = ["openai>=1.0", "anthropic>=0.25"]
all = ["epistemic-agent[tui,llm]"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
capmap = "epistemic_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["epistemic_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
